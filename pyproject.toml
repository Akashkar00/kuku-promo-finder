[project]
name = "promo-finder"
version = "0.1.0"
description = "Find ranked promo clips in microdrama screenplays"
readme = "README.md"
authors = [
    { name = "Akashkar00", email = "karakash828@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "openai>=3.57.0",
    "pydantic",
    "python-dotenv",
    "pyyaml",
    "rich",
    "streamlit>=1.67.0",
    "typer",
]

[project.scripts]
promo-finder = "promo_finder.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
